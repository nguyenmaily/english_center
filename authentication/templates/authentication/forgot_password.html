{% extends 'core/base.html' %}
{% block title %}Quên mật khẩu{% endblock %}
{% block content %}
<div class="auth-box">
  <h2>Quên mật khẩu</h2>
  {% if errors %}
    <div class="alert">{{ errors.email.0 }}</div>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <label>Email</label>
    <input type="email" name="email" value="{{ form.email|default:'' }}" required>
    <button type="submit" class="btn mt">Gửi mã OTP</button>
  </form>
  <p class="mt">Đã có mã? <a href="/dat-lai-mat-khau/">Đặt lại mật khẩu</a></p>
</div>
{% endblock %}
